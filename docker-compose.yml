# Settings shared by api, worker and sweeper. YAML only lets you use an anchor (&app)
# after it's defined, so this sits at the top; "<<: *app" below pastes it in.
x-app: &app
  build: .
  image: agentforge:dev
  # Only started with --profile app, so `docker compose up -d` still starts just the
  # database and the queue, for when you run the api with `uv run uvicorn` (--reload).
  profiles: ["app"]
  # A tiny helper runs as process 1 and passes Ctrl+C / `docker compose stop` signals on.
  # Process 1 ignores SIGTERM unless the program asked for it, so without this the
  # sweeper (which doesn't) would wait 10 seconds and then be killed.
  init: true
  env_file: .env  # your API keys and GOOGLE_CLIENT_ID, read when the container starts
  environment:
    # Inside Docker, "localhost" is the container itself. The other containers are
    # reached by their service names, on their inside ports.
    DATABASE_URL: postgresql://agentforge:agentforge@postgres:5432/agentforge
    PUBSUB_EMULATOR_HOST: pubsub:8085
  depends_on:
    postgres:
      condition: service_healthy
    pubsub:
      condition: service_started

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: agentforge   # local only; production passwords live in Secret Manager
      POSTGRES_DB: agentforge
    ports:
      - "5433:5432"
    volumes:
      # A named volume: your data survives `docker compose down`.
      # `docker compose down -v` deletes it and gives you an empty database.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Docker asks Postgres "are you ready?" every 5 seconds; `docker compose ps`
      # shows "healthy" once it says yes.
      test: ["CMD-SHELL", "pg_isready -U agentforge -d agentforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  pubsub:
    # Google's Pub/Sub emulator: a fake Pub/Sub on your laptop, so the queue works offline
    # and costs nothing. Our code is the same as on Google Cloud; only
    # PUBSUB_EMULATOR_HOST=localhost:8085 in .env points the client here.
    # It keeps messages in memory: restarting it empties the queue (see the README).
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --project=agentforge-local --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"

  # ---- AgentForge itself: one image, three jobs ----
  api:
    <<: *app
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: ["python", "-m", "worker.main"]
    # On "stop", Docker sends SIGTERM, waits this long, then kills. The worker hands its
    # run back between steps, and a step can take a while.
    stop_grace_period: 90s

  sweeper:
    <<: *app
    command: ["python", "-m", "worker.sweeper", "--loop"]

volumes:
  pgdata:
