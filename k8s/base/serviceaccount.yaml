# The identity our pods run as. Workload Identity links it to the Google service account
# agentforge-app, so the pods can use Pub/Sub and Cloud SQL WITHOUT any key file:
# GKE hands them short-lived Google tokens instead. (A leaked key file works forever.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentforge
  annotations:
    iam.gke.io/gcp-service-account: agentforge-app@agentforge-shre-2026.iam.gserviceaccount.com
