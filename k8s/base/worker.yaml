# The workers: take run IDs from Pub/Sub and run the agent. To handle more runs at once, add
# workers (replicas). They're waiting on the AI most of the time, not using CPU, so CPU-based
# autoscaling would be wrong here; the right signal is the queue's backlog (next step: KEDA).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: {app: worker}
spec:
  replicas: 2
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      serviceAccountName: agentforge
      # On SIGTERM the worker finishes its current step, hands the run back and exits.
      # A step (an AI call, with retries) can take a while, so give it up to 2 minutes.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          restartPolicy: Always
          args:
            - --structured-logs
            - --port=5432                    # the app connects to 127.0.0.1:5432
            - --health-check
            - --http-address=0.0.0.0
            - --exit-zero-on-sigterm
            - $(INSTANCE_CONNECTION_NAME)    # e.g. agentforge-shre-2026:europe-west2:agentforge-db
          env:
            - name: INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef: {name: agentforge-config, key: INSTANCE_CONNECTION_NAME}
          startupProbe:                      # the app starts only once this says "ready"
            httpGet: {path: /startup, port: 9090}
            periodSeconds: 1
            failureThreshold: 30
          resources:
            requests: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      containers:
        - name: worker
          image: agentforge
          args: [python, -m, worker.main]
          envFrom:
            - configMapRef: {name: agentforge-config}
            - secretRef: {name: agentforge-secrets}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: worker}
