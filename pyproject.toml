[project]
name = "agentforge"
version = "0.1.0"
description = "A low-code agent platform. First agent: the Job Hunt Agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.32",
    "fastapi>=0.146.0",
    "google-cloud-pubsub>=2.43.0",
    "langchain>=1.4.4",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pdfplumber>=0.11.10",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
# LangGraph fills the state step by step, and the graph's edges guarantee each key exists
# before a later step reads it (test_full_run checks this). The checker can't see the
# edges, so this rule only gives false alarms for LangGraph state.
reportTypedDictNotRequiredAccess = "none"
